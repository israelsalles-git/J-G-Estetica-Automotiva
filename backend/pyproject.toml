[project]
name = "jg-estetica-backend"
version = "0.1.0"
description = "API de gestão de clientes da J&G Estética Automotiva"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Integração com o Google Agenda (só necessária se GOOGLE_CALENDAR_ID estiver configurado)
google = [
    "google-api-python-client>=2.200",
    "google-auth>=2.60",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "api: testes de endpoints HTTP",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
